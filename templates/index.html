<!doctype html><html><head><meta charset="utf-8"><title>Energy &amp; Ags Commodities Trading</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
*{box-sizing:border-box}
html{overflow-x:hidden}
body{background:#0b0f14;color:#d8dee9;font:13px/1.3 Consolas,Menlo,monospace;margin:0}
header{padding:5px 10px;background:#111821;border:1px solid #1e2a38;border-radius:4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
h1{font-size:15px;margin:0;color:#ffb000} h2{font-size:13px;margin:0 0 4px;color:#7fd1ff}
#app{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,23vw,460px);gap:6px;padding:6px;align-items:start;min-height:100vh}
#main{display:flex;flex-direction:column;gap:6px;min-width:0}
#top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}#top .p{font-size:11px}#top h2{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#top .src{max-height:2.6em;overflow:auto;font-size:9px}
#fx table{font-size:10.5px}#fx>div{gap:6px!important}#macro td{padding:1px 3px}.spk{width:90px;height:20px;display:block}
.pend{display:inline-block;background:#8a8f98;color:#000;border-radius:2px;padding:0 3px;font-size:9px}.conf{display:inline-block;background:#d00000;color:#fff;border-radius:2px;padding:0 3px;font-size:9px}tr.ap td{color:#9aa3ad}
#fut,#agp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#agrow{display:block}#agnews{}
#bot{display:flex;flex-direction:column;gap:6px}
.p{background:#111821;border:1px solid #1e2a38;border-radius:4px;padding:6px;overflow:hidden;min-width:0}
table{width:100%;border-collapse:collapse}td,th{padding:0 3px;text-align:right;white-space:nowrap}th{color:#8899aa;font-weight:normal}td:first-child,th:first-child{text-align:left}
.up{color:#3fd47a}.dn{color:#ff5c5c}.src{color:#667788;font-size:10px;margin-top:3px;overflow-wrap:anywhere}.err{color:#ffb000}
.chart{height:110px}
#side{position:sticky;top:6px;height:calc(100vh - 12px);display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:6px;min-width:0;align-self:start}
#news,#gnews,#agnews{display:flex;flex-direction:column;min-height:0;overflow:hidden;height:100%}#side .news{flex:1 1 auto;overflow:auto;min-height:0}.news div{border-bottom:1px solid #1b2531;padding:3px 0}#side .p{display:flex;flex-direction:column;min-height:0}#side .src{flex:0 0 auto}
#side h2{font-size:12px}#side .src{max-height:3.6em;overflow:auto}
#fx>div{flex-wrap:wrap}
#ves{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:6px}
#ves .vt{overflow:auto;font-size:11px;max-height:470px}#ves .vt td{white-space:normal;text-align:left}#ves #vm{height:440px;border-radius:4px;overflow:hidden;border:1px solid #888}#ves .vs{grid-column:1/3}
#wx{display:flex;flex-direction:column}#wx .maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}#wx .maps>div{aspect-ratio:4.6/5.6}
a{color:#9cc9ff;text-decoration:none}.tag{display:inline-block;width:52px;color:#000;border-radius:2px;text-align:center;font-size:10px;margin-right:4px}
.world,.politics{background:#d0d6de}.macro,.business{background:#f2c46d}.usda,.us{background:#3fd47a}.eu{background:#7fb8ff}.brazil{background:#ffe066}.argentina{background:#9fd8ff}.estimates{background:#c58cff}.shipping{background:#ff9a5c}.markets{background:#8fe3b0}.energy{background:#ffb000}.ags{background:#3fd47a}.war{background:#ff5c5c}.movers{background:#7fd1ff}.vessels{background:#c58cff}
@media (max-height:850px){#side .src{display:none}#side h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:1500px){body{font-size:12px}td,th{padding:0 2px}#ves{grid-template-columns:1fr}#ves .vs{grid-column:1}}
.tag.forexlive{background:#1f4e79}.tag.fx{background:#5b3a8a}.ck{cursor:pointer}tr.ck:hover td,h2.ck:hover{background:#1a2533}
#hm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}#hm.on{display:flex}
#hb{width:900px;height:560px;max-width:96vw;max-height:94vh;background:#111821;border:1px solid #2e4058;border-radius:6px;padding:8px;display:flex;flex-direction:column;box-shadow:0 8px 30px #000}
#hb{position:fixed}#hb .hd{cursor:move;user-select:none;display:flex;justify-content:space-between;align-items:center}#hx{background:none;border:0;color:#d8dee9;font-size:20px;cursor:pointer}#hc{flex:1;min-height:0;touch-action:none}#hc *{touch-action:none}
/* carry curves: static, never capture touch so the page scrolls */.chart,.chart *{touch-action:manipulation!important}.chart{pointer-events:none}</style></head><body>
<div id="app"><div id="main"><header><h1>Energy &amp; Ags Commodities Trading</h1><span id="clock"></span></header><div id="top"><div class="p" id="fx"></div><div class="p" id="crack"></div><div class="p" id="macro"></div></div><div id="fut"><div class="p" id="p_CL"></div><div class="p" id="p_BZ"></div><div class="p" id="p_HO"></div><div class="p" id="p_RB"></div><div class="p" id="p_NG"></div><div class="p" id="p_TTF"></div></div><div class="p" id="ves"></div><div id="agrow"><div id="agp"><div class="p" id="p_ZS"></div><div class="p" id="p_ZM"></div><div class="p" id="p_ZL"></div><div class="p" id="p_ZC"></div><div class="p" id="p_ZW"></div><div class="p" id="p_KE"></div><div class="p" id="crush" style="grid-column:1/-1"></div></div></div><div class="p" id="wx"></div></div><div id="side"><div class="p" id="news"></div><div class="p" id="gnews"></div><div class="p" id="agnews"></div></div></div><div id="g" style="display:none"></div>
<script>
const PANELS=[["CL","WTI Crude"],["BZ","Brent Crude"],["HO","NY Heating Oil / ULSD"],["NG","Henry Hub Nat Gas"],["TTF","EU Nat Gas TTF"],["RB","RBOB Gasoline"],["ZS","Soybeans"],["ZM","Soybean Meal"],["ZL","Soybean Oil"],["ZC","Corn"],["ZW","Wheat (SRW)"],["KE","KC Wheat (HRW)"]];
const g=document.getElementById('g');
const SUF={CL:'.NYM',BZ:'.NYM',HO:'.NYM',RB:'.NYM',NG:'.NYM',TTF:'.NYM',ZS:'.CBT',ZM:'.CBT',ZL:'.CBT',ZC:'.CBT',ZW:'.CBT',KE:'.CBT'};
const L={paper_bgcolor:'#111821',plot_bgcolor:'#111821',font:{color:'#aab',size:10},margin:{l:40,r:8,t:6,b:24},xaxis:{gridcolor:'#1e2a38'},yaxis:{gridcolor:'#1e2a38'}};
const C={displayModeBar:false,responsive:true};
function mk(id,cls,t){let d=document.getElementById(id);if(!d){d=document.createElement('div');d.id=id;d.className='p '+(cls||'');g.appendChild(d)}d.innerHTML=t;return d}
const f=(x,n=2)=>x==null?'—':(+x).toFixed(n), cl=x=>x>0?'up':x<0?'dn':'';
const lt=s=>s?new Date(s).toLocaleString('en-GB',{timeZone:'Europe/Zurich',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
async function J(n){try{return await (await fetch('data/'+n+'.json?t='+Date.now(),{cache:'no-store'})).json()}catch(e){return {error:String(e)}}}
async function prices(){const P=await J('prices');window._P=P;try{window._hlive&&window._hlive(P)}catch(e){console.warn('popup live update',e)}
 // layout order
 mk('fx','w2','');mk('crack','w2','');mk('macro','','');
 for(const[k,n] of PANELS){const d=P[k]||{error:'not yet fetched'};const dec=['NG','HO','RB'].includes(k)?4:2;
  let h=`<h2>${n} <span class=src>${d.unit||''}</span></h2>`;
  if(!d.rows||!d.rows.length){h+=`<div class=err>UNAVAILABLE — ${d.error||d.error_last||''}</div>`}
  else{h+='<table><tr><th>Contract</th><th>Last</th><th>Chg</th><th>%</th><th>As of</th></tr>'+d.rows.map(r=>`<tr class=ck data-sym="${r.contract}${SUF[k]}" data-name="${n} ${r.contract}"><td>${r.contract}</td><td>${f(r.last,dec)}</td><td class=${cl(r.chg)}>${f(r.chg,dec)}</td><td class=${cl(r.pct)}>${f(r.pct)}</td><td>${r.asof.slice(5)}</td></tr>`).join('')+'</table><div class=chart id=c_'+k+'></div>'}
  h+=`<div class=src>${d.source||''} · DELAYED · fetched ${lt(P.updated)}</div>`;
  mk('p_'+k,'',h);
  if(d.rows&&d.rows.length)Plotly.newPlot('c_'+k,[{x:d.rows.map(r=>r.contract),y:d.rows.map(r=>r.last),mode:'lines+markers',line:{color:'#ffb000'}}],{...L,dragmode:false,xaxis:{...L.xaxis,fixedrange:true},yaxis:{...L.yaxis,fixedrange:true}},{...C,staticPlot:true,scrollZoom:false,doubleClick:false})}}
async function cracks(){const c=await J('cracks');if(!c.dates){mk('crack','w2','<h2>Crack spreads</h2><div class=err>UNAVAILABLE '+(c.error||c.error_last||'')+'</div>');return}
 const n=c.dates.length-1;
 mk('crack','w2',`<h2>Cracks $/bbl — WTI 3-2-1 <b>${f(c.wti321[n])}</b> · Brent <b>${f(c.brent321[n])}</b> · HO–Brent <b>${f(c.ho_brent[n])}</b></h2><div id=cc style="height:195px"></div><div class=src>${c.formula}<br>${c.source} · ${lt(c.updated)}</div>`);
 Plotly.newPlot('cc',[{x:c.dates,y:c.wti321,name:'WTI 3-2-1'},{x:c.dates,y:c.brent321,name:'Brent 3-2-1'},{x:c.dates,y:c.ho_brent,name:'HO–Brent'}],{...L,xaxis:{gridcolor:'#1e2a38',nticks:6,tickformat:'%d %b'},margin:{l:30,r:6,t:4,b:18},legend:{orientation:'h',y:1.18,font:{size:9}}},C)}
async function fx(){const x=await J('fx');if(!x.spot){mk('fx','w2','<h2>EUR/USD</h2><div class=err>UNAVAILABLE '+(x.error||x.error_last||'')+'</div>');return}
 const fu=(x.futures&&x.futures.rows)||[];
 mk('fx','w2',`<h2 class=ck data-sym="EURUSD=X" data-name="EUR/USD spot">EUR/USD spot <b>${f(x.spot,5)}</b> <span class=${cl(x.chg)}>${f(x.pct)}%</span> · USD/EUR <b>${f(x.usdeur,5)}</b></h2>
 <div style="display:flex;gap:10px"><table><tr><th>Tenor*</th><th>EURUSD</th><th>USDEUR</th><th>Fwd pts</th></tr>${x.forwards.map(r=>`<tr><td>${r.tenor}</td><td>${f(r.eurusd,5)}</td><td>${f(r.usdeur,5)}</td><td>${f(r.points,1)}</td></tr>`).join('')}</table>
 <table><tr><th>CME 6E</th><th>Last</th><th>Chg</th><th>USDEUR</th></tr>${fu.map(r=>`<tr class=ck data-sym="${r.contract}.CME" data-name="CME Euro FX ${r.contract}"><td>${r.contract}</td><td>${f(r.last,5)}</td><td class=${cl(r.chg)}>${f(r.chg,5)}</td><td>${f(1/r.last,5)}</td></tr>`).join('')}</table></div>
 <div class=src>SOFR ${x.rates.sofr}% (${x.rates.sofr_date}) · €STR ${x.rates.estr}% (${x.rates.estr_date}). ${x.source} · ${lt(x.updated)}</div>`)}
async function news(){const n=await J('news');mk('news','w2',`<h2>Energy &amp; war news — oil · gas · products · OPEC · Hormuz · Russia–Ukraine · shipping · movers</h2><div class=news>${(n.items||[]).map(i=>`<div><span class="tag ${i.cat}">${i.cat}</span>${lt(i.ts)} · <a href="${i.link}" target=_blank>${i.title}</a> <span class=src>${i.source}</span></div>`).join('')||'<span class=err>UNAVAILABLE '+(n.error||'')+'</span>'}</div><div class=src>${n.source||''} · ${lt(n.updated)} ${(n.errors||[]).join('; ')}</div>`)}
async function gnews(){const n=await J('gnews');mk('gnews','',`<h2>General / Markets news — world · macro · markets · politics</h2><div class=news>${(n.items||[]).map(i=>`<div><span class="tag ${i.cat}">${i.cat}</span>${lt(i.ts)} · <a href="${i.link}" target=_blank>${i.title}</a> <span class=src>${i.source}</span></div>`).join('')||'<span class=err>UNAVAILABLE '+(n.error||'')+'</span>'}</div><div class=src>${n.source||''} · ${lt(n.updated)} ${(n.errors||[]).join('; ')}</div>`)}
async function agnews(){const n=await J('agnews');mk('agnews','',`<h2>Ags news — USDA · US · EU · Brazil · Argentina · estimates</h2><div class=news>${(n.items||[]).map(i=>`<div><span class="tag ${i.cat}">${i.cat}</span>${lt(i.ts)} · <a href="${i.link}" target=_blank>${i.title}</a> <span class=src>${i.source}</span></div>`).join('')||'<span class=err>UNAVAILABLE '+(n.error||n.error_last||'')+'</span>'}</div><div class=src>${n.source||''} · ${lt(n.updated)} ${(n.errors||[]).join('; ')}</div>`)}
async function crush(){const c=await J('crush');if(!c.rows||!c.rows.length){mk('crush','','<h2>Soybean board crush</h2><div class=err>UNAVAILABLE '+(c.error||c.error_last||'')+'</div>');return}
 const r0=c.rows[0];
 mk('crush','',`<h2>Soybean board crush ($/bu) — front ${r0.set} <b>${f(r0.crush,3)}</b> <span class=${cl(r0.chg)}>${f(r0.chg,3)}</span> · oil share <b>${f(r0.oil_share,1)}%</b></h2>
 <div style="display:flex;gap:8px"><table style="flex:0 0 auto;width:auto;font-size:11px"><tr><th>Set (beans/products)</th><th>Beans ¢</th><th>Meal $</th><th>Oil ¢</th><th>Crush $/bu</th><th>Chg</th><th>Oil %</th></tr>${c.rows.map(r=>`<tr><td>${r.set}</td><td>${f(r.beans,2)}</td><td>${f(r.meal,1)}</td><td>${f(r.oil,2)}</td><td><b>${f(r.crush,3)}</b></td><td class=${cl(r.chg)}>${f(r.chg,3)}</td><td>${f(r.oil_share,1)}</td></tr>`).join('')}</table>
 <div id=crc style="flex:1;min-width:0;height:200px"></div></div><div class=src>${c.formula}<br>${c.source} · DELAYED · as of ${r0.asof} · fetched ${lt(c.updated)}</div>`);
 if(c.hist)Plotly.newPlot('crc',[{x:c.hist.dates,y:c.hist.crush,name:'Crush $/bu ('+c.hist.set+')',line:{color:'#ffb000'}},{x:c.hist.dates,y:c.hist.oil_share,name:'Oil share %',yaxis:'y2',line:{color:'#7fd1ff',width:1}}],
  {...L,margin:{l:36,r:36,t:4,b:22},legend:{orientation:'h',y:1.15,font:{size:9}},xaxis:{gridcolor:'#1e2a38',tickformat:'%b'},yaxis2:{overlaying:'y',side:'right',gridcolor:'rgba(0,0,0,0)'}},C)}
function spk(v,up){if(!v||v.length<2)return '';const mn=Math.min(...v),mx=Math.max(...v),w=90,h=20;const p=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-1-(y-mn)/((mx-mn)||1)*(h-2)).toFixed(1)}`).join(' ');return `<svg class=spk viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill=none stroke="${up?'#3fd47a':'#ff5c5c'}" stroke-width=1.3 points="${p}"/></svg>`}
async function macro(){const m=await J('macro');if(!m.rows||!m.rows.length){mk('macro','','<h2>Macro snapshot</h2><div class=err>UNAVAILABLE '+(m.error||m.error_last||'not yet fetched')+'</div>');return}
 mk('macro','',`<h2>Macro snapshot — DXY · gold · UST 10Y · S&amp;P · Nasdaq · VIX · BTC</h2><table><tr><th></th><th>Last</th><th>Chg</th><th>%</th><th>1M</th></tr>${m.rows.map(r=>{const y=r.ticker=='^TNX';return `<tr class=ck data-sym="${r.ticker}" data-name="${r.name}"><td>${r.name}</td><td>${f(r.last,r.dec)}${y?'%':''}</td><td class=${cl(r.chg)}>${y?f(r.chg*100,1)+'bp':f(r.chg,r.dec)}</td><td class=${cl(r.pct)}>${f(r.pct)}</td><td>${spk(r.spark,r.spark[r.spark.length-1]>=r.spark[0])}</td></tr>`}).join('')}</table><div class=src>${m.source} · ${lt(m.updated)} ${(m.errors||[]).join('; ')}</div>`)}
async function vessels(){const v=await J('vessels');if(!v.verified)return;
 const V=[...v.verified.map(r=>({...r,status:'verified'})),...(v.auto||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const row=(r,i,p=r.status=='pending')=>`<tr${p?' class=ap':''}><td><b style='color:${p?'#8a8f98':'#ff5c5c'}'>${i+1}</b>${p?' <span class=pend>pending</span>':r.status=='confirmed'?' <span class=conf>auto</span>':''}</td><td>${(r.date||'').slice(5)}</td><td>${r.vessel}</td><td>${r.imo||'not reported'}</td><td>${r.type}</td><td>${r.cargo}</td><td>${r.location}</td><td>${r.sources?r.sources.map(s=>`<a href="${s.link}" target=_blank>${s.source}</a>`).join(', ')+` (${r.n_sources} reputable)`:r.source}</td></tr>`;
 mk('ves','w2',`<div class=vt><h2>Merchant vessels hit — verified + auto-detected <span class=src>last checked ${lt(v.checked||v.updated)} · ${v.articles_scanned||0} articles scanned</span></h2><table><tr><th>#</th><th>Date</th><th>Vessel</th><th>IMO</th><th>Type</th><th>Cargo</th><th>Location</th><th>Source</th></tr>${V.map((r,i)=>row(r,i)).join('')}</table><h2 style='margin-top:6px'>Live incident reports (unverified headlines)</h2><div class=news style="max-height:150px;overflow:auto">${v.reports.map(i=>`<div>${lt(i.ts)} · <a href="${i.link}" target=_blank>${i.title}</a> <span class=src>${i.source||''}</span></div>`).join('')}</div></div><div id=vm></div><div class='src vs'>${v.source} ${(v.errors||[]).join('; ')} · positions approximate · fetched ${lt(v.updated)}</div>`);
 const places=[["Persian Gulf",51.6,27.3,14,'#1f4e79'],["Gulf of Oman",58.7,24.3,13,'#1f4e79'],["Strait of<br>Hormuz",57.75,26.75,11,'#1f4e79'],["IRAN",54.5,29.6,13,'#444'],["SAUDI ARABIA",48.6,24.2,12,'#444'],["UAE",54.2,23.6,12,'#444'],["OMAN",58.4,22.7,12,'#444'],["QATAR",51.2,25.1,10,'#444'],["IRAQ",47.4,30.6,10,'#444'],["KUWAIT",47.6,29.4,9,'#444'],["BAHRAIN",50.2,26.3,8,'#444']];
 const ports=[["Ras Tanura",50.16,26.64,"bottom right"],["Jebel Ali",55.03,24.99,"bottom left"],["Bandar Abbas",56.27,27.18,"top left"],["Fujairah",56.36,25.12,"bottom right"],["Khor Fakkan",56.35,25.34,"middle right"],["Muscat",58.59,23.61,"bottom left"],["Sohar",56.75,24.36,"bottom left"]];
 Plotly.newPlot('vm',[
  {type:'scattergeo',lon:places.map(p=>p[1]),lat:places.map(p=>p[2]),text:places.map(p=>p[0]),mode:'text',textfont:{size:places.map(p=>p[3]),color:places.map(p=>p[4]),family:'Arial'},hoverinfo:'skip'},
  {type:'scattergeo',lon:ports.map(p=>p[1]),lat:ports.map(p=>p[2]),text:ports.map(p=>p[0]),mode:'markers+text',textposition:ports.map(p=>p[3]),marker:{symbol:'square',size:6,color:'#222'},textfont:{size:10,color:'#222',family:'Arial'},hoverinfo:'text'},
  {type:'scattergeo',lon:V.map(r=>r.lon),lat:V.map(r=>r.lat),mode:'markers+text',text:V.map((r,i)=>String(i+1)),textfont:{color:'#fff',size:12,family:'Arial Black'},marker:{size:24,color:V.map(r=>r.status=='pending'?'#8a8f98':'#d00000'),line:{color:'#fff',width:2}},
   hovertext:V.map((r,i)=>`#${i+1}${r.status=='pending'?' PENDING':''} ${r.vessel} (IMO ${r.imo}) ${r.date}<br>${r.type}<br>${r.location}`),hoverinfo:'text'}],
  {paper_bgcolor:'#f4f1ea',showlegend:false,margin:{l:0,r:0,t:0,b:0},geo:{projection:{type:'mercator'},lonaxis:{range:[48,60.2]},lataxis:{range:[22.8,30.3]},resolution:50,bgcolor:'#f4f1ea',showland:true,landcolor:'#ece4d2',showocean:true,oceancolor:'#bcdcf2',showlakes:true,lakecolor:'#bcdcf2',showcoastlines:true,coastlinecolor:'#2b2b2b',coastlinewidth:1.2,showcountries:true,countrycolor:'#555',countrywidth:1,showframe:true,framecolor:'#999'}},C)}
async function weather(){const w=await J('weather'),c=await J('clim');if(!w.precip7){mk('wx','w4','<h2>Weather</h2><div class=err>UNAVAILABLE '+(w.error||'')+'</div>');return}
 const lat=[],lon=[];for(const a of w.lat)for(const b of w.lon){lat.push(a);lon.push(b)}
 const an=c.clim7?w.precip7.map((p,i)=>+(p-c.clim7[i]).toFixed(1)):null;
 mk('wx','w4',`<h2>South America grain belt — 7-day forecast (${w.days[0]} → ${w.days[6]})</h2><div class=maps><div id=w1></div><div id=w2></div><div id=w3></div></div>
 <div class=src>${w.source} · ${lt(w.updated)}. Anomaly = forecast minus ${c.clim7?c.years+' mean for same 7-day window ('+c.source+')':'climatology UNAVAILABLE: '+(c.error||c.error_last||'computing')}. Boxes: MT, PR, RS, Pampas.</div>`);
