<style>
*{box-sizing:border-box}
html{overflow-x:hidden}
body{background:#0b0f14;color:#d8dee9;font:13px/1.3 Consolas,Menlo,monospace;margin:0}
header{padding:5px 10px;background:#111821;border:1px solid #1e2a38;border-radius:4px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}header .brand{display:flex;align-items:center;gap:10px;min-width:0}header .brand img{height:28px;width:auto;display:block;flex:0 0 auto}header .brand h1{font-size:14px;margin:0;color:#ffb000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}#top .p{font-size:11px}#top h2{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#top .src{max-height:2.6em;overflow:auto;font-size:9px}
#fx table{font-size:10.5px}#fx>div{gap:6px!important}#macro td{padding:1px 3px}.spk{width:90px;height:20px;display:block}
.pend{display:inline-block;background:#8a8f98;color:#000;border-radius:2px;padding:0 3px;font-size:9px}.conf{display:inline-block;background:#d00000;color:#fff;border-radius:2px;padding:0 3px;font-size:9px}tr.ap td{color:#9aa3ad}
#fut,#agp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

#bot{display:flex;flex-direction:column;gap:6px}

table{width:100%;border-collapse:collapse}td,th{padding:0 3px;text-align:right;white-space:nowrap}th{color:#8899aa;font-weight:normal}td:first-child,th:first-child{text-align:left}
.up{color:#3fd47a}.dn{color:#ff5c5c}.src{color:#667788;font-size:10px;margin-top:3px;overflow-wrap:anywhere}.err{color:#ffb000}
.chart{height:110px}
#side{position:sticky;top:6px;height:calc(100vh - 12px);display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:6px;min-width:0;align-self:start}
#news,#gnews,#agnews{display:flex;flex-direction:column;min-height:0;overflow:hidden;height:100%}#side .news{flex:1 1 auto;overflow:auto;min-height:0}.news div{border-bottom:1px solid #1b2531;padding:3px 0}#side .p{display:flex;flex-direction:column;min-height:0}#side .src{flex:0 0 auto}
#side h2{font-size:12px}#side .src{max-height:3.6em;overflow:auto}
#fx>div{flex-wrap:wrap}

#ves .vt{overflow:auto;font-size:11px;max-height:470px}#ves .vt td{white-space:normal;text-align:left}#ves #vm{height:440px;border-radius:4px;overflow:hidden;border:1px solid #888}#ves .vs{grid-column:1/3}
#wx{display:flex;flex-direction:column}#wx .maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}#wx .maps>div{aspect-ratio:4.6/5.6}
a{color:#9cc9ff;text-decoration:none}.tag{display:inline-block;width:52px;color:#000;border-radius:2px;text-align:center;font-size:10px;margin-right:4px}
.world,.politics{background:#d0d6de}.macro,.business{background:#f2c46d}.usda,.us{background:#3fd47a}.eu{background:#7fb8ff}.brazil{background:#ffe066}.argentina{background:#9fd8ff}.estimates{background:#c58cff}.shipping{background:#ff9a5c}.markets{background:#8fe3b0}.energy{background:#ffb000}.ags{background:#3fd47a}.war{background:#ff5c5c}.movers{background:#7fd1ff}.vessels{background:#c58cff}
@media (max-height:850px){#side .src{display:none}#side h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:1500px){body{font-size:12px}td,th{padding:0 2px}#ves{grid-template-columns:1fr}#ves .vs{grid-column:1}}
.tag.forexlive{background:#1f4e79}.tag.fx{background:#5b3a8a}.ck{cursor:pointer}tr.ck:hover td,h2.ck:hover{background:#1a2533}
#hm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}#hm.on{display:flex}
#hb{width:900px;height:560px;max-width:96vw;max-height:94vh;background:#111821;border:1px solid #2e4058;border-radius:6px;padding:8px;display:flex;flex-direction:column;box-shadow:0 8px 30px #000}
#hb{position:fixed}#hb .hd{cursor:move;user-select:none;display:flex;justify-content:space-between;align-items:center}#hx{background:none;border:0;color:#d8dee9;font-size:20px;cursor:pointer}#hc{flex:1;min-height:0;touch-action:none}#hc *{touch-action:none}
/* carry curves: static, never capture touch so the page scrolls */.chart,.chart *{touch-action:manipulation!important}.chart{pointer-events:none}#windy{display:flex;flex-direction:column}.wbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}.wbar button{background:#1b2531;color:#cfd8e3;border:1px solid #2c3a4a;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer}.wbar button.on{background:#2a6df4;color:#fff;border-color:#2a6df4}.wsep{color:#55606e}.wfr{position:relative;width:100%;height:clamp(320px,55vh,620px)}.wfr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:4px}#wxd summary{cursor:pointer;font-size:12px;color:#8a8f98;padding:4px 0}
</style></head><body>
<div id="app"><div id="main"><header><div class="brand"><img src="assets/logo.png" alt="MedCommodities" height="28"><h1>Energy &amp; Ags Commodities Trading</h1></div><span id="clock"></span></header><div id="top"><div class="p" id="fx"></div><div class="p" id="crack"></div><div class="p" id="macro"></div></div><div id="fut"><div class="p" id="p_CL"></div><div class="p" id="p_BZ"></div><div class="p" id="p_HO"></div><div class="p" id="p_RB"></div><div class="p" id="p_NG"></div><div class="p" id="p_TTF"></div></div><div class="p" id="ves"></div><div id="agrow"><div id="agp"><div class="p" id="p_ZS"></div><div class="p" id="p_ZM"></div><div class="p" id="p_ZL"></div><div class="p" id="p_ZC"></div><div class="p" id="p_ZW"></div><div class="p" id="p_KE"></div></div><div id="crushrow"><div class="p" id="crush"></div><div class="p" id="palm"></div></div></div><div class="p" id="windy"><h2>Live weather — Windy (ECMWF) <span class=src>embed.windy.com</span></h2><div class=wbar><span id=wreg></span><span class=wsep>|</span><span id=wlay></span></div><div class=wfr><iframe id=wif title="Windy live weather map" loading=lazy allowfullscreen></iframe></div></div><details id=wxd><summary>Static South America 7-day maps (fallback)</summary><div class="p" id="wx"></div></details></div><div id="side"><div class="p" id="news"></div><div class="p" id="gnews"></div><div class="p" id="agnews"></div></div></div><div id="g" style="display:none"></div>
<script>
const PANELS=[["CL","WTI Crude"],["BZ","Brent Crude"],["HO","NY Heating Oil / ULSD"],["NG","Henry Hub Nat Gas"],["TTF","EU Nat Gas TTF"],["RB","RBOB Gasoline"],["ZS","Soybeans"],["ZM","Soybean Meal"],["ZL","Soybean Oil"],["ZC","Corn"],["ZW","Wheat (SRW)"],["KE","KC Wheat (HRW)"]];
const g=document.getElementById('g');
// symbols are canonical ids (ZSF27, GC1!, US10Y ...); vendor codes live server-side in providers/symbols.py
const L={paper_bgcolor:'#111821',plot_bgcolor:'#111821',font:{color:'#aab',size:10},margin:{l:40,r:8,t:6,b:24},xaxis:{gridcolor:'#1e2a38'},yaxis:{gridcolor:'#1e2a38'}};
const C={displayModeBar:false,responsive:true};
function mk(id,cls,t){let d=document.getElementById(id);if(!d){d=document.createElement('div');d.id=id;d.className='p '+(cls||'');g.appendChild(d)}d.innerHTML=t;return d}
const SRC=s=>String(s||'').replace(/\s*on free Yahoo/gi,'').replace(/(free )?Yahoo( Finance)?\s*/gi,'').replace(/^\s*\(([^()]*)\)/,'$1').replace(/,?\s*delayed[^·;)]*/gi,'').replace(/\(\s*\)/g,'').replace(/\s{2,}/g,' ').replace(/^[;,·\s]+/,'').trim();
const f=(x,n=2)=>x==null?'—':(+x).toFixed(n), cl=x=>x>0?'up':x<0?'dn':'';
const lt=s=>s?new Date(s).toLocaleString('en-GB',{timeZone:'Europe/Zurich',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
async function J(n){try{return await (await fetch('data/'+n+'.json?t='+Date.now(),{cache:'no-store'})).json()}catch(e){return {error:String(e)}}}
async function prices(){const P=await J('prices');window._P=P;try{window._hlive&&window._hlive(P)}catch(e){console.warn('popup live update',e)}
 // layout order
 mk('fx','w2','');mk('crack','w2','');mk('macro','','');
 for(const[k,n] of PANELS){const d=P[k]||{error:'not yet fetched'};const dec=['NG','HO','RB'].includes(k)?4:2;
  let h=`<h2>${n} <span class=src>${d.unit||''}</span></h2>`;
  if(!d.rows||!d.rows.length){h+=`<div class=err>UNAVAILABLE — ${d.error||d.error_last||''}</div>`}
  else{h+='<table><tr><th>Contract</th><th>Last</th><th>Chg</th><th>%</th><th>As of</th></tr>'+d.rows.map(r=>`<tr class=ck data-sym="${r.contract}" data-name="${n} ${r.contract}"><td>${r.contract}</td><td>${f(r.last,dec)}</td><td class=${cl(r.chg)}>${f(r.chg,dec)}</td><td class=${cl(r.pct)}>${f(r.pct)}</td><td>${r.asof.slice(5)}</td></tr>`).join('')+'</table><div class=chart id=c_'+k+'></div>'}
  h+=`<div class=src>${SRC(d.source)} · fetched ${lt(P.updated)}</div>`;
  mk('p_'+k,'',h);
  if(d.rows&&d.rows.length)Plotly.newPlot('c_'+k,[{x:d.rows.map(r=>r.contract),y:d.rows.map(r=>r.last),mode:'lines+markers',line:{color:'#ffb000'}}],{...L,dragmode:false,xaxis:{...L.xaxis,fixedrange:true},yaxis:{...L.yaxis,fixedrange:true}},{...C,staticPlot:true,scrollZoom:false,doubleClick:false})}}
async function cracks(){const c=await J('cracks');if(!c.dates){mk('crack','w2','<h2>Crack spreads</h2><div class=err>UNAVAILABLE '+(c.error||c.error_last||'')+'</div>');return}
 const n=c.dates.length-1;
 mk('crack','w2',`<h2>Cracks $/bbl — WTI 3-2-1 <b>${f(c.wti321[n])}</b> · Brent <b>${f(c.brent321[n])}</b> · HO–Brent <b>${f(c.ho_brent[n])}</b></h2><div id=cc style="height:195px"></div><div class=src>${c.formula}<br>${SRC(c.source)} · ${lt(c.updated)}</div>`);
 Plotly.newPlot('cc',[{x:c.dates,y:c.wti321,name:'WTI 3-2-1'},{x:c.dates,y:c.brent321,name:'Brent 3-2-1'},{x:c.dates,y:c.ho_brent,name:'HO–Brent'}],{...L,xaxis:{gridcolor:'#1e2a38',nticks:6,tickformat:'%d %b'},margin:{l:30,r:6,t:4,b:18},legend:{orientation:'h',y:1.18,font:{size:9}}},C)}
async function fx(){const x=await J('fx');if(!x.spot){mk('fx','w2','<h2>EUR/USD</h2><div class=err>UNAVAILABLE '+(x.error||x.error_last||'')+'</div>');return}
 const fu=(x.futures&&x.futures.rows)||[];
 mk('fx','w2',`<h2 class=ck data-sym="EURUSD" data-name="EUR/USD spot">EUR/USD spot <b>${f(x.spot,5)}</b> <span class=${cl(x.chg)}>${f(x.pct)}%</span> · USD/EUR <b>${f(x.usdeur,5)}</b></h2>
 <div style="display:flex;gap:10px"><table><tr><th>Tenor*</th><th>EURUSD</th><th>USDEUR</th><th>Fwd pts</th></tr>${x.forwards.map(r=>`<tr><td>${r.tenor}</td><td>${f(r.eurusd,5)}</td><td>${f(r.usdeur,5)}</td><td>${f(r.points,1)}</td></tr>`).join('')}</table>
 <table><tr><th>CME 6E</th><th>Last</th><th>Chg</th><th>USDEUR</th></tr>${fu.map(r=>`<tr class=ck data-sym="${r.contract}" data-name="CME Euro FX ${r.contract}"><td>${r.contract}</td><td>${f(r.last,5)}</td><td class=${cl(r.chg)}>${f(r.chg,5)}</td><td>${f(1/r.last,5)}</td></tr>`).join('')}</table></div>
 <div class=src>SOFR ${x.rates.sofr}% (${x.rates.sofr_date}) · €STR ${x.rates.estr}% (${x.rates.estr_date}). ${SRC(x.source)} · ${lt(x.updated)}</div>`)}
async function news(){const n=await J('news');mk('news','w2',`<h2>Energy &amp; war news — oil · gas · products · OPEC · Hormuz · Russia–Ukraine · shipping · movers</h2><div class=news>${(n.items||[]).map(i=>`<div><span class="tag ${i.cat}">${i.cat}</span>${lt(i.ts)} · <a href="${i.link}" target=_blank>${i.title}</a> <span class=src>${i.source}</span></div>`).join('')||'<span class=err>UNAVAILABLE '+(n.error||'')+'</span>'}</div><div class=src>${SRC(n.source)} · ${lt(n.updated)} ${(n.errors||[]).join('; ')}</div>`)}
async function gnews(){const n=await J('gnews');mk('gnews','',`<h2>General / Markets news — world · macro · markets · politics</h2><div class=news>${(n.items||[]).map(i=>`<div><span class="tag ${i.cat}">${i.cat}</span>${lt(i.ts)} · <a href="${i.link}" target=_blank>${i.title}</a> <span class=src>${i.source}</span></div>`).join('')||'<span class=err>UNAVAILABLE '+(n.error||'')+'</span>'}</div><div class=src>${SRC(n.source)} · ${lt(n.updated)} ${(n.errors||[]).join('; ')}</div>`)}
async function agnews(){const n=await J('agnews');mk('agnews','',`<h2>Ags news — USDA · US · EU · Brazil · Argentina · estimates</h2><div class=news>${(n.items||[]).map(i=>`<div><span class="tag ${i.cat}">${i.cat}</span>${lt(i.ts)} · <a href="${i.link}" target=_blank>${i.title}</a> <span class=src>${i.source}</span></div>`).join('')||'<span class=err>UNAVAILABLE '+(n.error||n.error_last||'')+'</span>'}</div><div class=src>${SRC(n.source)} · ${lt(n.updated)} ${(n.errors||[]).join('; ')}</div>`)}
async function crush(){const c=await J('crush');if(!c.rows||!c.rows.length){mk('crush','','<h2>Soybean board crush</h2><div class=err>UNAVAILABLE '+(c.error||c.error_last||'')+'</div>');return}
 const r0=c.rows[0];
 mk('crush','',`<h2>Soybean board crush ($/bu) — front ${r0.set} <b>${f(r0.crush,3)}</b> <span class=${cl(r0.chg)}>${f(r0.chg,3)}</span> · oil share <b>${f(r0.oil_share,1)}%</b></h2>
 <div style="display:flex;gap:6px;flex-wrap:wrap"><table style="flex:0 0 auto;width:auto;font-size:10.5px"><tr><th>Set</th><th>Beans</th><th>Meal</th><th>Oil</th><th>Crush</th><th>Chg</th><th>Oil%</th></tr>${c.rows.map(r=>`<tr><td>${r.set}</td><td>${f(r.beans,2)}</td><td>${f(r.meal,1)}</td><td>${f(r.oil,2)}</td><td><b>${f(r.crush,3)}</b></td><td class=${cl(r.chg)}>${f(r.chg,3)}</td><td>${f(r.oil_share,1)}</td></tr>`).join('')}</table>
 <div id=crc style="flex:1;min-width:160px;height:200px"></div></div><div class=src>${c.formula}<br>${SRC(c.source)} · as of ${r0.asof} · fetched ${lt(c.updated)}</div>`);
 if(c.hist)Plotly.newPlot('crc',[{x:c.hist.dates,y:c.hist.crush,name:'Crush $/bu ('+c.hist.set+')',line:{color:'#ffb000'}},{x:c.hist.dates,y:c.hist.oil_share,name:'Oil share %',yaxis:'y2',line:{color:'#7fd1ff',width:1}}],
  {...L,margin:{l:36,r:36,t:4,b:22},legend:{orientation:'h',y:1.15,font:{size:9}},xaxis:{gridcolor:'#1e2a38',tickformat:'%b'},yaxis2:{overlaying:'y',side:'right',gridcolor:'rgba(0,0,0,0)'}},C)}
async function palm(){const p=await J('palm');if(p.last==null){mk('palm','','<h2>Palm oil (CME CPO)</h2><div class=err>UNAVAILABLE '+(p.error||p.error_last||'')+'</div>');return}
 mk('palm','',`<h2 class=ck data-sym="CPO1!" data-name="CME USD Malaysian Crude Palm Oil">Palm oil — CME CPO <b>${f(p.last,2)}</b> <span class=${cl(p.chg)}>${f(p.chg,2)}</span> <span class=${cl(p.pct)}>(${f(p.pct)}%)</span> <span class=src>${p.unit}</span></h2>
 <div style="font-size:11px;margin:2px 0 4px">SBO <b>${f(p.sbo_usd,1)}</b> USD/t (${f(p.sbo_cpt,2)} ¢/lb) · SBO−palm <b class=${cl(p.spread)}>${f(p.spread,1)}</b> <span class=${cl(p.spread_chg)}>${f(p.spread_chg,1)}</span></div>
 <div id=pmc style="height:200px"></div>
 <div class=src>${SRC(p.note)}<br>${p.formula||''}<br>${SRC(p.source)} · as of ${p.asof} · fetched ${lt(p.updated)}</div>`);
 const tr=[];
 if(p.hist)tr.push({x:p.hist.dates,y:p.hist.palm,name:'Palm USD/t (CME CPO)',line:{color:'#3fd47a'}});
 if(p.spread_hist)tr.push({x:p.spread_hist.dates,y:p.spread_hist.spread,name:'SBO−palm USD/t',yaxis:'y2',line:{color:'#ffb000',width:1}});
 if(tr.length)Plotly.newPlot('pmc',tr,{...L,margin:{l:40,r:40,t:4,b:22},legend:{orientation:'h',y:1.15,font:{size:9}},xaxis:{gridcolor:'#1e2a38',tickformat:'%b'},yaxis2:{overlaying:'y',side:'right',gridcolor:'rgba(0,0,0,0)'}},C)}
function spk(v,up){if(!v||v.length<2)return '';const mn=Math.min(...v),mx=Math.max(...v),w=90,h=20;const p=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-1-(y-mn)/((mx-mn)||1)*(h-2)).toFixed(1)}`).join(' ');return `<svg class=spk viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill=none stroke="${up?'#3fd47a':'#ff5c5c'}" stroke-width=1.3 points="${p}"/></svg>`}
async function macro(){const m=await J('macro');if(!m.rows||!m.rows.length){mk('macro','','<h2>Macro snapshot</h2><div class=err>UNAVAILABLE '+(m.error||m.error_last||'not yet fetched')+'</div>');return}
 mk('macro','',`<h2>Macro snapshot — DXY · gold · silver · UST 10Y · S&amp;P · Nasdaq · VIX · BTC</h2><table><tr><th></th><th>Last</th><th>Chg</th><th>%</th><th>1M</th></tr>${m.rows.map(r=>{const y=r.ticker=='US10Y'||r.ticker=='^TNX';return `<tr class=ck data-sym="${r.ticker}" data-name="${r.name}"><td>${r.name}</td><td>${f(r.last,r.dec)}${y?'%':''}</td><td class=${cl(r.chg)}>${y?f(r.chg*100,1)+'bp':f(r.chg,r.dec)}</td><td class=${cl(r.pct)}>${f(r.pct)}</td><td>${spk(r.spark,r.spark[r.spark.length-1]>=r.spark[0])}</td></tr>`}).join('')}</table><div class=src>${SRC(m.source)} · ${lt(m.updated)} ${(m.errors||[]).join('; ')}</div>`)}
async function vessels(){const v=await J('vessels');if(!v.verified)return;
 const V=[...v.verified.map(r=>({...r,status:'verified'})),...(v.auto||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const row=(r,i,p=r.status=='pending')=>`<tr${p?' class=ap':''}><td><b style='color:${p?'#8a8f98':'#ff5c5c'}'>${i+1}</b>${p?' <span class=pend>'+(r.claim?'UNVERIFIED claim':'pending')+'</span>':r.status=='confirmed'?' <span class=conf>auto</span>':''}</td><td>${(r.date||'').slice(5)}</td><td>${r.vessel}</td><td>${r.imo||'not reported'}</td><td>${r.type}</td><td>${r.cargo}</td><td>${r.location}</td><td>${r.sources?r.sources.map(s=>`<a href="${s.link}" target=_blank>${s.source}</a>`).join(', ')+` (${r.n_sources} reputable)`:r.source}</td></tr>`;
 mk('ves','w2',`<div class=vt><h2>Merchant vessels hit — verified + auto-detected <span class=src>last checked ${lt(v.checked||v.updated)} · ${v.articles_scanned||0} articles scanned</span></h2><table><tr><th>#</th><th>Date</th><th>Vessel</th><th>IMO</th><th>Type</th><th>Cargo</th><th>Location</th><th>Source</th></tr>${V.map((r,i)=>row(r,i)).join('')}</table><h2 style='margin-top:6px'>Live incident reports (unverified headlines)</h2><div class=news style="max-height:150px;overflow:auto">${v.reports.map(i=>`<div>${lt(i.ts)} · <a href="${i.link}" target=_blank>${i.title}</a> <span class=src>${i.source||''}</span></div>`).join('')}</div></div><div id=vm></div><div class='src vs'>${SRC(v.source)} ${(v.errors||[]).join('; ')} · positions approximate · fetched ${lt(v.updated)}</div>`);

 const m=sym.match(/^(ZS|ZM|ZL|ZC|ZW|KE|CL|BZ|HO|RB|NG|TTF|6E)[FGHJKMNQUVXZ]\d{2}$/),s2=(src==='cont'&&m)?m[1]+'1!':sym,base=(tf==='1wk'||tf==='1mo')?'1d':tf;
